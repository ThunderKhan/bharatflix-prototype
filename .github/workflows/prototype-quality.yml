name: Prototype quality

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Automated tests
        run: npm test
      - name: SQLite CMS seed and catalogue inspection
        run: npm run db:seed && npm run db:status && npm run db:inspect
      - name: Auth HTTP smoke (production server)
        run: npm run test:auth-smoke
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
